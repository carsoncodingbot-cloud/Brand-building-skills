name: Fetch van asset
on:
  push:
    branches: ["claude/glacier-hvac-business-iizyvt"]
    paths: [".github/workflows/fetch-van-asset.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download van renders
        run: |
          mkdir -p solar-site/brand/van
          curl -fL -o solar-site/brand/van/van-original.png "https://d8j0ntlcm91z4.cloudfront.net/user_3EI4gPQXbCIDkEZJNju9hERMEXZ/hf_20260821_070814_4751a4f4-29f8-4a31-8c60-5192f38771c0.png"
          curl -fL -o solar-site/brand/van/van-cutout.png "https://d8j0ntlcm91z4.cloudfront.net/user_3EI4gPQXbCIDkEZJNju9hERMEXZ/hf_20260821_073843_4b87186e-3919-4cde-97b8-2d9d545c8ae1.png"
          ls -la solar-site/brand/van/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add solar-site/brand/van
          git commit -m "Add Daylight van wrap renders (fetched via CI)" || echo "nothing to commit"
          git push
