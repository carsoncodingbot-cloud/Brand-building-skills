schema_version: "1.1"
name: plumbing-ad-copy-pack
expected_outcome: |
  A launch-pack markdown file with three hook-distinct ad concepts (not
  three flavors of one angle), each with 3 primary texts structured
  hook/mechanism/offer/contact, headlines around 40 characters or less,
  descriptions with risk-reversal; a plumbing-adapted lead grading and
  pricing matrix including the never-invoice-unqualified rule; a calm
  permission-based 60-second callback script; and zero fabricated claims
  (no invented review counts, years, or statistics).
